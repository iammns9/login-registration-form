<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration Form</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <canvas id="network-canvas"></canvas>

    <div class="form-container">

        <!-- COL 1: Illustration -->
        <div class="col col-1">
            <div class="image-layer">
                <video class="form-image login-img" autoplay loop muted playsinline>
                    <source src="../../assets/images/login.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <!-- COL 2: Form -->
        <div class="col col-2">
            <div class="login-wrapper">

                <div class="login-toggle">
                    <button type="button" class="toggle-btn active" data-mode="signin">Sign In</button>
                    <button type="button" class="toggle-btn" data-mode="signup">Sign Up</button>
                </div>

                <h2 class="login-title" id="form-title">Sign In</h2>
                <div class="form-message" id="form-message"></div>

                <form class="login-form" id="auth-form" novalidate>

                    <div class="input-box signup-only">
                        <input type="email" id="email" name="email" placeholder="Email" autocomplete="email">
                        <i class='bx bx-envelope'></i>
                    </div>

                    <div class="input-box">
                        <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
                        <i class='bx bx-user'></i>
                    </div>

                    <div class="input-box password-box">
                        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                        <i class='bx bx-lock-alt lock-icon'></i>
                        <i class='bx bx-hide toggle-password' data-target="password"></i>
                    </div>

                    <div class="input-box password-box signup-only">
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" autocomplete="new-password">
                        <i class='bx bx-lock-alt lock-icon'></i>
                        <i class='bx bx-hide toggle-password' data-target="confirm-password"></i>
                    </div>

                    <div class="forgot-link signin-only">
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn" id="submit-btn">Sign In</button>

                </form>

                <div class="social-icons">
                    <a href="#" data-provider="google"><i class='bx bxl-google'></i></a>
                    <a href="#" data-provider="facebook"><i class='bx bxl-facebook'></i></a>
                    <a href="#" data-provider="twitter"><i class='bx bxl-twitter'></i></a>
                    <a href="#" data-provider="github"><i class='bx bxl-github'></i></a>
                </div>

            </div>
        </div>

    </div>
    <script src="../js/network-animation.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
